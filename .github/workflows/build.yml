name: Build

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: "GitHub Release를 생성하고 zip 파일을 첨부"
        required: true
        type: boolean
        default: false

jobs:
  extension:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run build
      - run: npm run check:unit
      - run: npx playwright install --with-deps chromium
      - run: npm run check:browser

      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: browser-failure-traces
          path: test-results/
          if-no-files-found: ignore

      - name: Prepare release notes from README
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release == true
        id: release_notes
        env:
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
        run: node scripts/release-notes.mjs

      - uses: actions/upload-artifact@v6
        with:
          name: crop-clip-extension
          path: dist/crop-clip-*.zip
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release == true
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.release_notes.outputs.tag }}
          name: CropClip ${{ steps.release_notes.outputs.tag }}
          body_path: dist/release-notes.txt
          files: dist/crop-clip-*.zip
